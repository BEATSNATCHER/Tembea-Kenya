<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tembea-Kenya</title>

<body>  
    <header>
        <h1>Tembea-Kenya</h1>
        <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="destinations.html">Destinations</a>
                <a href="contact.html" aria-current="page">Contact</a>
        </nav>
    </header>  
    <main>
        <form action="#">  
           <label for="name">Full Name:*</label>  
           <input type="text" name="name" id="name"  placeholder="Enter Full Name" required>  

           <label for="email">Email Address:*</label>
           <input type="email" id="email" name="email" placeholder="elyasjimale221@gmail.com" required>

        <label for="destinations">Choose your destinations</label>  
        <select name="destinations" id="destinations">  
            <option value="">--choose--</option>
             <option value="Mombasa">Mombasa</option>
             <option value="Diani">Diani Beach</option>
             <option value="Lamu">Lamu Island</option>  
             <option value="Mara">Maasai Mara</option>
             <option value="Amboseli">Amboseli Park</option>  
             <option value="Nakuru">Lake Nakuru</option>
        </select> 
        <fieldset>
                <legend> travel style (Budget / Mid-range / Luxury)</legend>
                <input type="radio" name="budget" id="budget">
                <label for="budget">Budget Friendly</label>

                <input type="radio" name="mid" id="mid">
                <label for="mid">Mid-Range</label>

                <input type="radio" name="luxury" id="luxury">
                <label for="luxury">Luxury</label>
         </fieldset>

            <label for="message">Do you have any message for us?</label>
            <textarea name="message" id="message" cols="30" rows="10"></textarea>
        </form> 
    </main>
